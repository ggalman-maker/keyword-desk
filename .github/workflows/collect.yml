name: 키워드 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시 (UTC 22시)
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    paths:
      - "data/20*.json"     # 글 파일을 올리면 목록만 다시 만듦

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 또는 목록 갱신
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/collect.py --index-only
          else
            python scripts/collect.py
          fi
      - name: 변경 사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "자동 수집 $(date -u +%F)"
          git push
